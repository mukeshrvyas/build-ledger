<!DOCTYPE html>
<html lang="en"><head>

<style>
:root{--bg:#E9ECE8;--sf:#F8F9F7;--ink:#1B2527;--mu:#5E6B6E;--ac:#1F5C5A;--acx:#fff;--ln:#CBD2CD;--wn:#A4412F;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141A1B;--sf:#1D2527;--ink:#E6ECEA;--mu:#93A09F;--ac:#6DBDB6;--acx:#0F1718;--ln:#2E3A3B;--wn:#E08A77;color-scheme:dark}}
*{box-sizing:border-box}

.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}

button.g{background:transparent;color:var(--ac)}button.d{background:transparent;color:var(--wn);border-color:var(--wn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btns button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mu);border-radius:0;min-height:56px}

#sheet>div{background:var(--sf);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0))}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:40}
.rc{border:1px solid var(--ln);padding:16px;border-radius:8px}.rc table{width:100%;border-collapse:collapse}.rc td{padding:6px 0;border-bottom:1px solid var(--ln)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0)}nav button{font-size:13px;padding:0}.rc th{text-align:left;font-size:13px;color:var(--mu);padding:6px 8px 6px 0;white-space:nowrap}.rc td{padding:6px 8px 6px 0;white-space:nowrap}
@media print{body.rp>#sheet,body.rp>#nav{display:none!important}body.rp>main#app{display:block!important}body.rp #app>*:not(#rep){display:none!important}body>*:not(#sheet){display:none!important}#sheet{position:static;background:none;display:block}#sheet>div{max-width:none;border-radius:0}.noprint{display:none!important}}

<div id="toast" role="status"></div>
<script>
const K='buildledger.v1';
const fresh=()=>({projects:[],items:[],uses:[],costs:[],bills:[],set:{prefix:'ART',cur:'$',biz:'',logo:'',syncLocal:true}});
let db=fresh();
function norm(){for(const k of['tools','vendors','customers','purchases','docs'])db[k]=db[k]||[];db.set=db.set||{};db.set.syncLocal=db.set.syncLocal!==false;
  db.items.forEach(i=>i.min=i.min??0);
  db._syncTs=db._syncTs||Date.now();
  if(db.items.some(i=>!i.lots)){db.items.forEach(i=>{if(i.lots)return;const l={id:uid(),date:'',qty:Math.max(i.bought||0,i.qty||0),rem:i.qty||0,uc:i.unit_cost||0};i.lots=[l];
    db.uses.filter(u=>u.iid==i.id&&!u.al).forEach(u=>u.al=[{lid:l.id,qty:u.qty,cost:u.cost}]);delete i.qty;delete i.unit_cost;delete i.bought});save()}}
const VK='buildledger.vault',FK='buildledger.fails',ITER=600000,TE=new TextEncoder(),TD=new TextDecoder();
let KEY=null,META=null,AUTH=null,_t,_busy=Promise.resolve(),_last=Date.now();
let SYNC_URL=null,SYNC_ONLINE=false,SYNC_QUEUE=[],SYNC_BUSY=false,SYNC_LAST=0;
let SQL_DB=null,SQL_READY=false;
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const kek=async(pw,salt,iter)=>{const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey'])};
const wrapDek=async(k,dek)=>{const iv=rnd(12);return{iv,wk:new Uint8Array(await crypto.subtle.wrapKey('raw',dek,k,{name:'AES-GCM',iv}))}};
const unwrapDek=(k,iv,wk)=>crypto.subtle.unwrapKey('raw',wk,k,{name:'AES-GCM',iv},{name:'AES-GCM'},true,['encrypt','decrypt']);
const newDek=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
const metaOf=v=>({salt:unb64(v.salt),iter:v.iter,pw:{iv:unb64(v.pw.iv),wk:unb64(v.pw.wk)},rs:v.rs?{salt:unb64(v.rs.salt),iter:v.rs.iter,iv:unb64(v.rs.iv),wk:unb64(v.rs.wk)}:null});
const rkNorm=x=>x.replace(/[^A-Za-z2-7]/g,'').toUpperCase();
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const aes=async(key,u8,aad)=>{const iv=rnd(12);return{iv,ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(aad)},key,u8))}};
const unaes=(key,iv,ct,aad)=>crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:TE.encode(aad)},key,ct).then(b=>new Uint8Array(b));
const sha=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode(x)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>{if(KEY){db._syncTs=Date.now();clearTimeout(_t);_t=setTimeout(flush,60)}};
function flush(){clearTimeout(_t);if(!KEY||!AUTH)return _busy;const k=KEY,m=META,snap=TE.encode(JSON.stringify({db,auth:AUTH}));
  _busy=_busy.then(async()=>{
    try{
      const{iv,ct}=await aes(k,snap,'vault');
      const vault={v:3,salt:b64(m.salt),iter:m.iter,pw:{iv:b64(m.pw.iv),wk:b64(m.pw.wk)},rs:m.rs&&{salt:b64(m.rs.salt),iter:m.rs.iter,iv:b64(m.rs.iv),wk:b64(m.rs.wk)},iv:b64(iv),ct:b64(ct)};
      const vaultJson=JSON.stringify(vault);
      await sqlSaveVault(vaultJson);
      localStorage.setItem(VK,vaultJson);
    }catch(e){toast('Could not save: storage is full or blocked')}
  }).then(async()=>{
    if(SYNC_ONLINE&&SYNC_URL&&!db.set.syncLocal){try{await syncPush()}catch(e){}}
  });return _busy}

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
norm();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>db.set.cur+(+n||0).toFixed(2),r4=n=>Math.round(n*1e4)/1e4;
const today=()=>new Date().toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
let S={v:'list',id:null};
const go=(v,id=null,sub)=>{S={v,id,sub};render();scrollTo(0,0)};
const V=id=>db.vendors.find(x=>x.id==id),C=id=>db.customers.find(x=>x.id==id),PU=id=>db.purchases.find(x=>x.id==id),pTot=p=>p.lines.reduce((a,l)=>a+(l.total??l.price),0),pGst=p=>p.lines.reduce((a,l)=>a+(l.gst||0),0),st=b=>b.status||'Paid';
const P=id=>db.projects.find(p=>p.id==id),I=id=>db.items.find(i=>i.id==id);
const iq=i=>r4(i.lots.reduce((a,l)=>a+l.rem,0)),ival=i=>i.lots.reduce((a,l)=>a+l.rem*l.uc,0);
const findItem=(n,u)=>db.items.find(i=>i.name.toLowerCase()==n.toLowerCase()&&i.unit.toLowerCase()==u.toLowerCase());
function take(i,q,lid){
  const ls=(lid?i.lots.filter(l=>l.id==lid):i.lots.filter(l=>l.rem>0)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(q>r4(ls.reduce((a,l)=>a+l.rem,0))+1e-9)return null;
  let left=q,al=[],cost=0;
  for(const l of ls){if(left<=1e-9)break;const t=Math.min(l.rem,left);l.rem=r4(l.rem-t);left=r4(left-t);al.push({lid:l.id,qty:t,cost:t*l.uc});cost+=t*l.uc}
  return{al,cost}}
function putBack(u){const i=I(u.iid);if(!i)return;(u.al||[]).forEach(a=>{const l=i.lots.find(x=>x.id==a.lid);if(l)l.rem=r4(l.rem+a.qty)})}
const rd=x=>Math.round(x*100)/100;
const gstCalc=(p,r,mode)=>{r=r||0;if(mode=='inc'&&r>0){const g=rd(p*r/(100+r));return{net:rd(p-g),gst:g,total:p}}if(mode=='exc'&&r>0){const g=rd(p*r/100);return{net:p,gst:g,total:rd(p+g)}}return{net:p,gst:0,total:p}};
const pCost=id=>db.uses.filter(u=>u.pid==id).reduce((a,u)=>a+u.cost,0)+db.costs.filter(c=>c.pid==id).reduce((a,c)=>a+c.amt,0);

/* ---------- bottom sheet form ---------- */
function sheet(title,fields,ok,okLabel='Save',extra=''){
  const f=fields.map(x=>{
    const a=`id="f_${x.k}" ${x.req?'required':''}`;
    let inp=x.opts?`<select ${a}>${x.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==x.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
      :x.t=='area'?`<textarea ${a} rows="3">${esc(x.v)}</textarea>`
      :`<input ${a} type="${x.t||'text'}" ${x.t=='number'?'step="any" inputmode="decimal"':''} value="${esc(x.v)}" placeholder="${esc(x.ph||'')}">`;
    return `<label for="f_${x.k}">${esc(x.l)}</label>${inp}`}).join('');
  $('#sbody').innerHTML=`<h2 style="margin-top:0">${esc(title)}</h2><div class="mu">${extra}</div>${f}<div class="btns"><button id="sok">${okLabel}</button><button class="g" id="scx">Cancel</button></div>`;
  $('#sheet').classList.add('open');
  $('#scx').onclick=close;
  $('#sok').onclick=()=>{const v={};for(const x of fields){const e=$('#f_'+x.k);v[x.k]=x.t=='number'?parseFloat(e.value):x.t=='password'?e.value:e.value.trim();
    if(x.req&&(v[x.k]===''||Number.isNaN(v[x.k]))){e.focus();toast(x.l+' is required');return}}
    close();if(ok(v)===false)$('#sheet').classList.add('open')};
}
const close=()=>$('#sheet').classList.remove('open');
$('#sheet').onclick=e=>{if(e.target.id=='sheet')close()};

/* ---------- actions ---------- */
function projForm(p){
  sheet(p?'Edit project':'New project',[
    {k:'name',l:'Project name',v:p?.name,req:1},{k:'tags',l:'Tags (comma separated)',v:p?.tags,ph:'walnut, table, commission'},
    {k:'ref',l:'Reference',v:p?.ref,ph:'Client, link or sketch number'},{k:'desc',l:'Description',v:p?.desc,t:'area'},
    {k:'margin',l:'Profit margin on cost (%)',v:p?.margin??30,t:'number',req:1},
    {k:'status',l:'Status',v:p?.status||'Building',opts:[['Building','Building'],['Finished','Finished'],['Sold','Sold']]}],
    v=>{if(p)Object.assign(p,v);else db.projects.unshift({id:uid(),created:today(),...v});save();render()});
}
function useForm(pid){
  const items=db.items.filter(i=>iq(i)>0);
  if(!items.length){toast('Add stock items first (Stock tab)');return}
  const lotOpts=iid=>[['','Oldest lot first (automatic)'],...I(iid).lots.filter(l=>l.rem>0).map(l=>[l.id,`${l.date||'Earlier'} · ${r4(l.rem)} left @ ${m(l.uc)}`])];
  sheet('Use from stock',[
    {k:'iid',l:'Stock item',v:items[0].id,opts:items.map(i=>[i.id,`${i.name} (${r4(iq(i))} ${i.unit} left)`])},
    {k:'lid',l:'Stock lot',v:'',opts:lotOpts(items[0].id)},
    {k:'qty',l:'Quantity used',t:'number',req:1},{k:'date',l:'Date',t:'date',v:today()}],
    v=>{const i=I(v.iid);if(!(v.qty>0))return false;const t=take(i,v.qty,v.lid);if(!t){toast('Not enough stock in that lot');return false}
      db.uses.push({id:uid(),pid,iid:i.id,qty:v.qty,cost:t.cost,al:t.al,date:v.date});save();render()},
    'Add to project','Stock comes from the oldest lot first unless you pick one. Each lot keeps its own unit cost, and the project is charged that cost.');
  $('#f_iid').onchange=e=>{$('#f_lid').innerHTML=lotOpts(e.target.value).map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')};
}
function costForm(pid){
  sheet('Add cost',[
    {k:'cat',l:'Category',v:'Material',opts:['Material','Labour','Travel','Vehicle','Other'].map(x=>[x,x])},
    {k:'desc',l:'Description',req:1,ph:'e.g. Walnut slab, 6 hrs sanding, 80 km to supplier'},
    {k:'qty',l:'Quantity (hours, km, units)',t:'number',v:1,req:1},{k:'rate',l:'Rate / price per unit',t:'number',req:1},
    {k:'date',l:'Date',t:'date',v:today()}],
    v=>{db.costs.push({id:uid(),pid,cat:v.cat,desc:v.desc,qty:v.qty,rate:v.rate,amt:v.qty*v.rate,date:v.date});save();render()},
    'Add cost','Amount = quantity × rate. For items used up entirely on this build, use quantity 1 and the full price.');
}
function itemForm(){
  sheet('New stock item',[{k:'name',l:'Name',req:1,ph:'Wood screws 4x40'},{k:'unit',l:'Unit',req:1,ph:'pcs, ml, g, m, sheet'},
    {k:'min',l:'Low stock alert when on hand drops below',t:'number',v:0,ph:'0 = off'},
    {k:'qty',l:'Quantity purchased',t:'number',req:1},{k:'price',l:'Total price paid',t:'number',req:1}],
    v=>{if(!(v.qty>0))return false;let i=findItem(v.name,v.unit);
      if(i){sheet('Item already exists',[{k:'act',l:'',opts:[['merge','Add as a new lot to the existing item'],['sep','Keep as a separate item']]}],
        w=>{if(w.act=='merge'){i.min=v.min??0;i.lots.push({id:uid(),date:today(),qty:v.qty,rem:v.qty,uc:v.price/v.qty});save();render();return true}
          if(w.act=='sep'){i={id:uid(),name:v.name,unit:v.unit,lots:[],min:v.min??0};db.items.push(i);i.lots.push({id:uid(),date:today(),qty:v.qty,rem:v.qty,uc:v.price/v.qty});save();render();return true}
          return false},'Continue','A stock item with this name and unit already exists. Merge adds stock to it (each lot keeps its own unit cost). Separate creates a new item.');return}
      i={id:uid(),name:v.name,unit:v.unit,lots:[],min:v.min??0};db.items.push(i);
      i.lots.push({id:uid(),date:today(),qty:v.qty,rem:v.qty,uc:v.price/v.qty});save();render()},
    'Save','If you already hold this item, this is stored as a separate lot with its own unit cost.');
}
function itemSheet(id){
  const i=I(id),ls=i.lots.filter(l=>l.rem>0);
  sheet(i.name,[{k:'qty',l:`New lot quantity (${i.unit})`,t:'number'},{k:'price',l:'Total price paid',t:'number'},{k:'min',l:'Low stock alert when on hand drops below',t:'number',v:i.min??0,ph:'0 = off'}],
    v=>{if(!(v.qty>0)||!(v.price>=0))return false;i.min=v.min??0;i.lots.push({id:uid(),date:today(),qty:v.qty,rem:v.qty,uc:v.price/v.qty});save();render()},
    'Add as new lot',`${r4(iq(i))} ${esc(i.unit)} on hand, worth ${m(ival(i))}.${i.min>0?' Low stock if below '+r4(i.min)+' '+esc(i.unit):''}<br>`+(ls.map(l=>`${esc(l.date||'Earlier')}: ${r4(l.rem)} of ${r4(l.qty)} ${esc(i.unit)} @ ${m(l.uc)}${l.inv?' · inv '+esc(l.inv):''}`).join('<br>')||'No stock left.'));
  i.lots.filter(l=>!l.pl&&l.rem>=l.qty-1e-9).forEach(l=>{const b=document.createElement('button');b.className='g';b.style.cssText='width:100%;margin-top:8px';
    b.textContent=`Remove unused lot (${r4(l.qty)} @ ${m(l.uc)})`;b.onclick=()=>{i.lots=i.lots.filter(x=>x.id!=l.id);save();close();render()};$('#sbody').append(b)});
  const b=document.createElement('button');b.className='d';b.textContent='Delete item';b.style.cssText='width:100%;margin-top:8px';
  b.onclick=()=>{if(db.uses.some(u=>u.iid==id)||db.purchases.some(p=>p.lines.some(l=>l.iid==id))){toast('Item has history; it cannot be deleted');return}db.items=db.items.filter(x=>x.id!=id);save();close();render()};
  $('#sbody').append(b);
}
function mergeItems(){
  const withStock=db.items.filter(i=>iq(i)>0);
  if(withStock.length<2){toast('Need at least two items with stock to merge.');return}
  sheet('Merge two stock items',[
    {k:'keep',l:'Keep this item (others will be merged into it)',v:withStock[0].id,opts:withStock.map(i=>[i.id,`${i.name} — ${r4(iq(i))} ${esc(i.unit)} on hand`])},
    {k:'into',l:'Merge this item into the kept one',v:'',opts:[]}
  ],
  v=>{if(v.keep==v.into){toast('Pick two different items');return false}
    const keep=I(v.keep),into=I(v.into);if(!keep||!into)return false;
    const keepVal=ival(keep),keepQty=iq(keep),intoVal=ival(into),intoQty=iq(into);
    const totQty=r4(keepQty+intoQty),totVal=r4(keepVal+intoVal);
    db.uses.filter(u=>u.iid==into.id).forEach(u=>{u.iid=keep.id});
    db.purchases.forEach(p=>{p.lines.filter(l=>l.iid==into.id).forEach(l=>{l.iid=keep.id;l.desc=keep.name})});
    into.lots.forEach(l=>{l.id=uid();keep.lots.push(l)});
    keep.min=Math.max(keep.min??0,into.min??0);
    db.items=db.items.filter(x=>x.id!=into.id);
    save();close();render();toast(`Merged '${esc(into.name)}' into '${esc(keep.name)}'. Combined: ${r4(totQty)} ${esc(keep.unit)} @ ${m(totQty>0?totVal/totQty:0)}`);return true},
  'Merge','Averages unit cost across remaining quantities. All project costs and purchase lines are re-pointed to the kept item. Units must match.');
  const optsKeep=withStock.map(i=>`<option value="${esc(i.id)}">${esc(i.name)} — ${r4(iq(i))} ${esc(i.unit)} on hand</option>`).join('');
  $('#f_keep').innerHTML=optsKeep;
  const updInto=()=>{const k=$('#f_keep').value;$('#f_into').innerHTML=withStock.filter(i=>i.id!=k).map(i=>`<option value="${esc(i.id)}">${esc(i.name)} — ${r4(iq(i))} ${esc(i.unit)} on hand</option>`).join('')};
  updInto();
  $('#f_keep').onchange=updInto;
}

async function syncPush(){
  if(!SYNC_URL||!KEY||!AUTH)return {ok:false,reason:'no server or not unlocked'};
  if(SYNC_BUSY)return {ok:false,reason:'busy'};
  SYNC_BUSY=true;
  try{
    let rev=0;
    try{const r=await fetch(SYNC_URL+'/api/kdf?user='+encodeURIComponent(AUTH.user||''));const j=await r.json();rev=j.rev||0}catch(e){}
    const k=KEY,m=META,snap=TE.encode(JSON.stringify({db,auth:AUTH}));
    const{iv,ct}=await aes(k,snap,'vault');
    const vault={v:3,salt:b64(m.salt),iter:m.iter,pw:{iv:b64(m.pw.iv),wk:b64(m.pw.wk)},rs:m.rs&&{salt:b64(m.rs.salt),iter:m.rs.iter,iv:b64(m.rs.iv),wk:b64(m.rs.wk)},iv:b64(iv),ct:b64(ct)};
    const authHash=AUTH.authHash||sha(String(AUTH));
    const resp=await fetch(SYNC_URL+'/api/vault',{
      method:'PUT',headers:{'X-User':AUTH.user||'','X-Auth':authHash,'Content-Type':'application/json'},
      body:JSON.stringify({baseRev:rev,vault})});
    if(resp.status===409){const j=await resp.json();return {ok:false,reason:'conflict',serverRev:j.serverRev}}
    if(!resp.ok)return {ok:false,reason:'http '+resp.status};
    const j=await resp.json();
    SYNC_LAST=Date.now();SYNC_QUEUE=[];save();
    return {ok:true,rev:j.rev};
  }catch(e){return {ok:false,reason:e.message}}finally{SYNC_BUSY=false}
}
async function syncPull(){
  if(!SYNC_URL||!KEY)return {ok:false,reason:'no server or not unlocked'};
  try{
    const resp=await fetch(SYNC_URL+'/api/vault',{headers:{'X-User':AUTH&&AUTH.user?AUTH.user:'','X-Auth':AUTH&&AUTH.authHash?AUTH.authHash:''}});
    if(resp.status===404)return {ok:true,reason:'no server vault',pulled:false};
    if(!resp.ok)return {ok:false,reason:'http '+resp.status};
    const v=await resp.json();
    const dek=await unwrapDek(await kek(AUTH.pw||'',unb64(v.salt),v.iter),unb64(v.pw.iv),unb64(v.pw.wk));
    const o=JSON.parse(TD.decode(await unaes(dek,unb64(v.iv),unb64(v.ct),'vault')));
    if(o.db&&o.db._syncTs&&db._syncTs&&o.db._syncTs>db._syncTs){
      db=o.db;AUTH=o.auth||AUTH;norm();save();SYNC_LAST=Date.now();
      return {ok:true,pulled:true,rev:v.rev};
    }
    return {ok:true,pulled:false,rev:v.rev};
  }catch(e){return {ok:false,reason:e.message}}
}
async function syncNow(){
  if(SYNC_BUSY)return;
  const pushRes=await syncPush();
  if(pushRes.reason==='conflict'){
    const pullRes=await syncPull();
    if(pullRes.pulled){SYNC_QUEUE=[];save()}
  }
  return pushRes
}

    'Turn on',`Scan the QR code with an authenticator app (Google Authenticator, Microsoft Authenticator, Aegis, 1Password) or type this key in: <b style="overflow-wrap:anywhere;font-family:ui-monospace,monospace">${sec}</b>`);
  const h=document.createElement('div');h.style.cssText='background:#fff;padding:8px;width:220px;max-width:100%;margin:8px auto;border-radius:8px';$('#sbody').querySelector('h2').after(h);
  try{await loadQr();const q=qrcode(0,'M');q.addData(url);q.make();h.innerHTML=q.createSvgTag(5,0)}catch(e){h.remove()}}
function showCodes(rc){$('#sbody').innerHTML=`<h2 style="margin-top:0">Save your recovery codes</h2><p class="mu">Each code works once if you lose your authenticator app. They are not shown again.</p>
  <div class="card" style="font-family:ui-monospace,monospace;columns:2">${rc.map(c=>`<div>${c}</div>`).join('')}</div>
  <div class="btns"><button id="cpy" class="g">Copy codes</button><button id="scx">I have saved them</button></div>`;
  $('#sheet').classList.add('open');$('#scx').onclick=close;$('#cpy').onclick=async()=>toast(await copyText(rc.join('\n'))?'Copied':'Copying is blocked here. Select the codes and copy them manually.')}
function twofaOff(){sheet('Turn off two-factor authentication',[{k:'code',l:'Current 6-digit code or a recovery code',req:1}],
  v=>{(async()=>{const ok=/^\d{6}$/.test(c.replace(/\s/g,''))?await checkCode(c):await checkRecovery(c);if(!ok){toast('That code did not match');return}AUTH.totp=null;AUTH.rec=[];save();close();render();toast('Two-factor turned off')})();return false},'Turn off')}
['pointerdown','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,()=>{_last=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(KEY&&AUTH&&Date.now()-_last>(AUTH.auto||5)*60000)lock()},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(KEY&&AUTH&&Date.now()-_last>(AUTH.auto||5)*60000)lock()});
addEventListener('pagehide',()=>flush());
async function boot(){
  if(!window.crypto?.subtle){lockUI('<p>Encryption needs a secure connection. Open this page through your https address (for example your Nabu Casa or reverse-proxy URL), not plain http.</p>');return}
  if(localStorage.getItem(VK))showLogin();else showSetup(localStorage.getItem(K))
  sqlLoadVault().catch(()=>{})
}
boot();
</script></body></html>
